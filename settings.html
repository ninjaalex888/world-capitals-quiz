<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · World Capitals Quiz</title>
<meta name="description" content="Learn the capital of every country with a daily challenge and endless practice.">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('settings')||'{}').theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🌍 World Capitals</a>
  <nav class="nav">
    <a href="index.html">Daily</a>
    <a href="practice.html">Practice</a>
    <a href="scores.html">Scores</a>
    <a href="settings.html" aria-current="page">Settings</a>
  </nav>
</header>
<main>
  <div class="page-head">
    <h1>Settings</h1>
    <p class="muted">Changes save automatically in this browser.</p>
  </div>
  <form class="card settings" id="settingsForm" onsubmit="return false">
    <h2>Quiz pictures</h2>
    <label class="setting">
      <span>Country flag<small>Shown with each question</small></span>
      <input type="checkbox" class="switch" id="showFlag" role="switch">
    </label>
    <label class="setting">
      <span>Capital city photo<small>Shown after you answer, so it doesn't give the answer away</small></span>
      <input type="checkbox" class="switch" id="showPhoto" role="switch">
    </label>

    <h2>Appearance</h2>
    <div class="segmented" role="radiogroup" aria-label="Theme">
      <label><input type="radio" name="theme" value="system"><span>System</span></label>
      <label><input type="radio" name="theme" value="light"><span>Light</span></label>
      <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
    </div>
    <p class="saved muted" id="saved" aria-live="polite"></p>
  </form>
</main>
<footer class="site-footer">
  Made by ninjaalex888 · Flags from <a href="https://flagcdn.com">flagcdn.com</a> · City photos from <a href="https://commons.wikimedia.org">Wikimedia Commons</a> · <a href="https://github.com/ninjaalex888/world-capitals-quiz">Source</a>
</footer>
<script src="script.js"></script>
<script>document.addEventListener('DOMContentLoaded',initSettings);</script>
</body>
</html>
